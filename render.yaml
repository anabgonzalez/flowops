services:
  - type: web
    runtime: node
    name: flowops-api
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npm run deploy:migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # paste in your Neon connection string after creating the service
      - key: PORT
        value: 5002
      - key: CLIENT_ORIGIN
        value: https://flowops-client.onrender.com
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false # paste in a random 32+ byte value, e.g. `openssl rand -hex 32`

  - type: web
    runtime: static
    name: flowops-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # fromService + property:host returns Render's *private* network
      # hostname, not the public *.onrender.com URL the browser needs to
      # hit — that mismatch was the cause of "Load failed" on every save.
      # Hardcoded to the actual deployed API URL instead.
      - key: VITE_API_URL
        value: https://flowops-api-4frp.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
