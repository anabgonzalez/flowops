services:
  - type: web
    runtime: node
    name: flowops-api
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npm run deploy:migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # paste in your Neon connection string after creating the service
      - key: PORT
        value: 5002

  - type: web
    runtime: static
    name: flowops-client
    rootDir: client
    buildCommand: npm install && VITE_API_URL="https://${API_HOST}" npm run build
    staticPublishPath: ./dist
    envVars:
      - key: API_HOST
        fromService:
          name: flowops-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
